name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Run headless rule tests
        run: sbcl --script src/test.lisp
